services:
  db:
    image: postgres:16
    container_name: library_db
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5433:5432"  # <-- Modifiez cette ligne
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
